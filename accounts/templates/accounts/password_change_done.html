{% extends "base.html" %}
{% block title %}Password Changed — CadStay{% endblock %}
{% block content %}
<div class="cs-auth-wrap">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mx-auto text-center" style="max-width: 480px;">
        <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle mx-auto mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h1 class="h4 fw-bold mb-2">Password Updated</h1>
        <p class="text-muted mb-4">Your account password has been changed successfully. You can now use your new password to sign in.</p>
        <a href="{% url 'accounts:profile' %}" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Back to Profile
        </a>
    </div>
</div>
{% endblock %}
