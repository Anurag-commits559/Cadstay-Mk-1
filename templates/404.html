{% extends "base.html" %}
{% block title %}Page Not Found — CadStay{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 p-5 text-center mx-auto" style="max-width: 560px;">
        <div class="mb-3">
            <span class="display-1 fw-black text-primary opacity-25">404</span>
        </div>
        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mx-auto mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-map fs-3"></i>
        </div>
        <h1 class="h4 fw-bold mb-2">Oops! Page not found</h1>
        <p class="text-muted mx-auto mb-4" style="max-width: 380px;">
            The page you're looking for might have been moved, renamed, or no longer exists. Let's get you back on track.
        </p>
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
            <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">
                <i class="bi bi-house me-1"></i> Go to Homepage
            </a>
            <a href="{% url 'hostels:hostel_list' %}" class="btn btn-outline-primary rounded-pill px-4 py-2">
                <i class="bi bi-search me-1"></i> Browse Hostels
            </a>
        </div>
    </div>
</div>
{% endblock %}
