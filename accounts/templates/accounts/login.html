{% extends "base.html" %}
{% block title %}Login - NoBroker{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <h3 class="fw-bold mb-4 text-center">Welcome back</h3>
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">{{ form.username.label }}</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ form.password.label }}</label>
                        {{ form.password }}
                    </div>
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
                </form>
                <p class="text-center text-secondary mt-3 mb-0">
                    Don't have an account? <a href="{% url 'accounts:register' %}">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
