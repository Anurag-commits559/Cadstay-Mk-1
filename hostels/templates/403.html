{% extends "base.html" %}
{% block title %}Access Denied — CadStay{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 p-5 text-center mx-auto" style="max-width: 560px;">
        <div class="mb-3">
            <span class="display-1 fw-black text-danger opacity-25">403</span>
        </div>
        <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle mx-auto mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-shield-exclamation fs-3"></i>
        </div>
        <h1 class="h4 fw-bold mb-2">Access Denied</h1>
        <p class="text-muted mx-auto mb-4" style="max-width: 380px;">
            {{ exception|default:"You don't have permission to view this page. Please log in with an authorised account to continue." }}
        </p>
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
            <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">
                <i class="bi bi-house me-1"></i> Back to Home
            </a>
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary rounded-pill px-4 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
